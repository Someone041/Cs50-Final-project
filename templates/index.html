<script>
let currentQuiz = [];
let currentIndex = 0;
let score = 0;

let xp = 0;
let level = 1;
let streak = 0;

function normalize(str) {
    return str.trim().toLowerCase().replace(/[^\w\s]/g, "");
}

function updateStats() {
    const xpEl = document.getElementById("xp");
    const levelEl = document.getElementById("level");
    const streakEl = document.getElementById("streak");

    if (!xpEl || !levelEl || !streakEl) return;

    xpEl.textContent = xp;
    levelEl.textContent = level;
    streakEl.textContent = streak;
}

async function loadStats() {
    try {
        const res = await fetch("/stats");
        const data = await res.json();

        xp = data.xp || 0;
        level = data.level || 1;
        streak = data.streak || 0;

        updateStats();
    } catch (e) {}
}

async function saveStats() {
    try {
        await fetch("/update_stats", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ xp, level, streak })
        });
    } catch (e) {}
}

async function generateQuiz() {
    const text = document.getElementById("text").value.trim();
    const num = document.getElementById("num").value;
    const output = document.getElementById("output");
    const status = document.getElementById("status");

    output.innerHTML = "";
    status.innerHTML = "Generating quiz...";
    status.className = "status loading";

    if (!text) {
        status.innerHTML = "Please enter text or upload a PDF first.";
        status.className = "status error";
        return;
    }

    try {
        const res = await fetch("/generate_quiz", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text, num_questions: num })
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || "Error");

        currentQuiz = data.quiz;
        currentIndex = 0;
        score = 0;

        status.innerHTML = "Quiz ready.";
        status.className = "status";

        showQuestion();
    } catch (err) {
        status.innerHTML = err.message;
        status.className = "status error";
    }
}

async function uploadPDF() {
    const fileInput = document.getElementById("pdfUpload");
    const status = document.getElementById("status");

    if (!fileInput.files.length) {
        status.innerHTML = "Please choose a PDF file first.";
        status.className = "status error";
        return;
    }

    status.innerHTML = "Uploading PDF...";
    status.className = "status loading";

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    try {
        const res = await fetch("/upload_pdf", {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || "Upload failed");

        document.getElementById("text").value = data.text || "";
        status.innerHTML = "PDF extracted successfully.";
        status.className = "status";
    } catch (err) {
        status.innerHTML = err.message;
        status.className = "status error";
    }
}

function showQuestion() {
    const output = document.getElementById("output");
    output.innerHTML = "";

    if (currentIndex >= currentQuiz.length) {
        const percent = Math.round((score / currentQuiz.length) * 100);

        output.innerHTML =
            "<h2>Quiz Complete</h2>" +
            "<p>" + score + " / " + currentQuiz.length + " (" + percent + "%)</p>" +
            "<p>" + (percent >= 80 ? "Great job" : percent >= 50 ? "Not bad" : "Keep practicing") + "</p>";

        xp += score * 10;
        streak += 1;

        if (xp >= level * 100) {
            level++;
        }

        updateStats();
        saveStats();
        return;
    }

    const q = currentQuiz[currentIndex];
    const div = document.createElement("div");
    div.className = "question";

    div.innerHTML =
        "<p>Question " + (currentIndex + 1) + " of " + currentQuiz.length + "</p>" +
        "<strong>" + q.question + "</strong><br><br>";

    q.choices.forEach((choice, index) => {
        const btn = document.createElement("button");
        btn.textContent = choice;
        btn.onclick = function () {
            checkAnswer(index, q, div);
        };
        div.appendChild(btn);
    });

    output.appendChild(div);
}

function checkAnswer(selectedIndex, q, div) {
    const buttons = div.querySelectorAll("button");
    buttons.forEach(b => b.disabled = true);

    const correctIndex = q.choices.findIndex(
        c => normalize(c) === normalize(q.answer)
    );

    const feedback = document.createElement("p");

    if (selectedIndex === correctIndex) {
        feedback.textContent = "Correct";
        score++;
        xp += 10;
        streak += 1;
    } else {
        feedback.textContent = "Wrong. Correct: " + (correctIndex !== -1 ? q.choices[correctIndex] : q.answer);
        streak = 0;
    }

    const expl = document.createElement("p");
    expl.textContent = q.explanation;

    div.appendChild(feedback);
    div.appendChild(expl);

    updateStats();

    currentIndex++;

    setTimeout(showQuestion, 1200);
}

window.onload = function () {
    loadStats();
    updateStats();
};
</script>
